services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      - "127.0.0.1:6333:6333" # REST API + Dashboard
      - "127.0.0.1:6334:6334" # gRPC API
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:z

  telegram-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: telegram-bot
    restart: unless-stopped
    depends_on:
      - qdrant
      - embedding-service
    env_file:
      - .env
    volumes:
      - ./data/reference:/app/data/reference    

  embedding-service:
    build: 
      context: ./embedding_service
      dockerfile: Dockerfile
    container_name: embedding-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
      
volumes:
  qdrant_storage:
  hf_cache: